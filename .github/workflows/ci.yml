name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

jobs: 
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js from .nvmrc
        uses: actions/setup-node@v4 
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run Unit/Integration Tests
        run: npm test

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/  
          retention-days: 7

      - name: Upload Test Results (JUnit/HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          
      - name: Run Linting / Quality Check
        run: npm run lint
        
  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish Test Report (JUnit)
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'test-results/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false
          
  # Rapport Allure généré avec allure-commandline (déjà en devDependency) plutôt
  # qu'avec simple-elf/allure-report-action : l'action n'est plus maintenue et son
  # image Docker (amazoncorretto:8) ne se télécharge plus. Java est préinstallé
  # sur ubuntu-latest. Le rapport HTML est livré en artefact.
  allure-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Allure Results Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report
        run: npm run allure:generate

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
